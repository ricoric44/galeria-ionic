<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>Informes (supervisión)</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="volver()">Volver</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido, {{ currentSession()?.username }}</ion-card-title>
      <ion-card-subtitle>Rol: {{ currentSession()?.role }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Pantalla permitida a <code>admin</code> y <code>supervisor</code> por <code>roleGuard('admin', 'supervisor')</code> con <code>canMatch</code>.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
